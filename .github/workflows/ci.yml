name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff

      - name: Lint (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Byte-compile every module (the brain needs live tokens, so it can't be imported)
        run: python -m compileall -q Jarvis_brain.py reminders.py worker.py confirmation.py memory_store.py

      - name: Tests
        run: python -m pytest -q tests
